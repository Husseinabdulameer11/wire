<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wire circuit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap">
<style>
:root {
  --paper: #f3f6f8;
  --grid: #dfe6ec;
  --grid-major: #cfd9e2;
  --ink: #1d2b3a;
  --ink-soft: #5b6b7c;
  --body: #ffffff;
  --panel: #ffffff;
  --panel-line: #c9d3dc;
  --hi: #e09a12;           /* selection, LEDs */
  --hi-soft: rgba(224,154,18,.18);
  --on: #1fae4b;           /* a 1 on a wire */
  --off: #155c2c;          /* a 0 on a wire */
  --unknown: #2f6fd6;
  --float: #9aa7b4;        /* a bus nobody drives */
  --bus: #1d2b3a;
  --bad: #c8322b;
  --seg-on: #e2321f;
  --seg-off: #e9eef2;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121a23; --grid: #1a2430; --grid-major: #222e3c;
    --ink: #d4dde7; --ink-soft: #8797a8; --body: #18222d; --panel: #18222d; --panel-line: #2c3a4a;
    --hi: #f0b23a; --hi-soft: rgba(240,178,58,.2);
    --on: #3ddc6f; --off: #1f5c34; --unknown: #5b93f0; --bus: #c7d2de; --bad: #ef5a52; --float: #5d6b7a;
    --seg-on: #ff4a33; --seg-off: #222e3a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121a23; --grid: #1a2430; --grid-major: #222e3c;
  --ink: #d4dde7; --ink-soft: #8797a8; --body: #18222d; --panel: #18222d; --panel-line: #2c3a4a;
  --hi: #f0b23a; --hi-soft: rgba(240,178,58,.2);
  --on: #3ddc6f; --off: #1f5c34; --unknown: #5b93f0; --bus: #c7d2de; --bad: #ef5a52; --float: #5d6b7a;
  --seg-on: #ff4a33; --seg-off: #222e3a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font: 15px/1.4 "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
#sheet { position: fixed; inset: 0; touch-action: none; cursor: grab; display: block; width: 100%; height: 100%; }
/* the labels on the circuit are not text to select: a drag moves parts, never a selection */
#sheet, #sheet * { -webkit-user-select: none; user-select: none; -webkit-user-drag: none; }
#sheet.panning { cursor: grabbing; }
.mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }

/* the toolbar sits on the sheet like a strip of tape */
#bar {
  position: fixed; top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px;
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center; pointer-events: none;
}
#bar > * { pointer-events: auto; }
.group { display: flex; flex-wrap: wrap; gap: 0; border: 1px solid var(--panel-line); background: var(--panel); border-radius: 6px; overflow: hidden; }
.group button + button { border-left: 1px solid var(--panel-line); }
button {
  font: inherit; font-weight: 500; color: var(--ink); background: transparent; border: 0;
  padding: 7px 12px; min-height: 36px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
}
button:hover { background: var(--hi-soft); }
button:focus-visible { outline: 2px solid var(--hi); outline-offset: -2px; }
button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
button svg { width: 14px; height: 14px; }
#rate { align-self: center; padding: 0 10px 0 4px; font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
#rate:empty { display: none; }
select { font: inherit; color: var(--ink); background: transparent; border: 0; border-left: 1px solid var(--panel-line); padding: 0 8px; min-height: 36px; }
.spacer { flex: 1; pointer-events: none; }
#crumbs button { gap: 5px; }
#crumbs button + button::before { content: "›"; color: var(--ink-soft); margin-right: 4px; }
#crumbs small { color: var(--ink-soft); font-size: 12px; font-weight: 400; }
#crumbs button[aria-current] { background: var(--hi-soft); cursor: default; }
#warn {
  display: none; background: var(--bad); color: #fff; border-radius: 6px; padding: 7px 12px; font-weight: 500;
}

/* the drafting title block, bottom right */
#titleblock {
  position: fixed; right: 10px; bottom: max(10px, env(safe-area-inset-bottom));
  background: var(--panel); border: 1.5px solid var(--ink); min-width: 230px; max-width: min(360px, calc(100vw - 20px));
  display: grid; grid-template-columns: auto 1fr; font-size: 12px; pointer-events: auto;
}
#titleblock > div { padding: 4px 8px; border-top: 1px solid var(--ink); }
#titleblock .k { color: var(--ink-soft); border-right: 1px solid var(--ink); }
#titleblock .name { grid-column: 1 / -1; border-top: 0; font-size: 19px; font-weight: 600; line-height: 1.15; padding: 7px 8px 6px; letter-spacing: -.01em; }
#titleblock .v { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* tooltip for wires */
#tip {
  position: fixed; pointer-events: none; display: none; background: var(--ink); color: var(--paper);
  padding: 5px 8px; border-radius: 4px; font-size: 12px; white-space: nowrap; z-index: 5;
}
#tip b { font-weight: 600; }

#valform {
  position: fixed; z-index: 6; display: flex; gap: 6px; align-items: center; background: var(--panel);
  border: 1.5px solid var(--ink); padding: 6px 6px 6px 10px; font-size: 13px; flex-wrap: wrap; max-width: calc(100vw - 20px);
}
#valform input { font: 14px "IBM Plex Mono", ui-monospace, monospace; width: 9em; padding: 6px 8px; border: 1px solid var(--panel-line); background: var(--paper); color: var(--ink); border-radius: 4px; }
#valform input:focus-visible { outline: 2px solid var(--hi); }
#valform button { border: 1px solid var(--panel-line); border-radius: 4px; min-height: 32px; }
#valform.bad input { border-color: var(--bad); }

/* sheets that slide up: truth table and source */
.drawer {
  position: fixed; left: 0; right: 0; bottom: 0; max-height: 58vh; background: var(--panel);
  border-top: 1.5px solid var(--ink); display: none; flex-direction: column; z-index: 4;
  padding-bottom: env(safe-area-inset-bottom);
}
.drawer.open { display: flex; }
@media (min-width: 900px) {
  .drawer { left: auto; top: 0; width: 420px; max-height: none; border-top: 0; border-left: 1.5px solid var(--ink); }
}
.drawer header { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 14px; border-bottom: 1px solid var(--panel-line); }
.drawer header h2 { font-size: 16px; font-weight: 600; margin: 0; flex: 1; }
.drawer .scroll { overflow: auto; flex: 1; }
.drawer .note { padding: 10px 14px; color: var(--ink-soft); max-width: 60ch; }

#src { margin: 0; padding: 8px 0; font: 13px/1.55 "IBM Plex Mono", ui-monospace, monospace; }
#src .ln { display: flex; padding: 0 14px 0 0; cursor: pointer; }
#src .ln:hover { background: var(--hi-soft); }
#src .ln.sel { background: var(--hi-soft); box-shadow: inset 3px 0 var(--hi); }
#src .no { width: 3.2em; text-align: right; padding-right: 1em; color: var(--ink-soft); flex: none; user-select: none; }
#src .tx { white-space: pre; }
#src .cm { color: var(--ink-soft); }
#vhdl { margin: 0; padding: 8px 0; font: 12.5px/1.55 "IBM Plex Mono", ui-monospace, monospace; }
#vhdl .ln { display: flex; padding: 0 14px 0 0; }
#vhdl .ln.sel { background: var(--hi-soft); box-shadow: inset 3px 0 var(--hi); }
#vhdl .no { width: 3.2em; text-align: right; padding-right: 1em; color: var(--ink-soft); flex: none; user-select: none; }
#vhdl .tx { white-space: pre; }
#vhdl .tx b { font-weight: 600; color: var(--ink); }
#vhdl .tx i { font-style: normal; color: var(--off); }
#vhdl .cm { color: var(--ink-soft); font-style: italic; }
#vhdlwhat { padding: 6px 14px 0; font-size: 12px; }
#vhdlwhat:empty { display: none; }
#booksel { font: inherit; font-size: 13px; border: 1px solid var(--panel-line); border-radius: 4px; min-height: 30px; max-width: 45%; background: var(--paper); color: var(--ink); }

/* the book: a pdf beside the circuit, on the left */
#book {
  position: fixed; left: 0; top: 0; bottom: 0; width: min(560px, 100vw); z-index: 4; background: var(--panel);
  border-right: 1.5px solid var(--ink); display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom);
}
#book[hidden] { display: none; }
body.book-open #bar { left: calc(min(560px, 100vw) + 10px); }
body.book-open #titleblock { display: none; }
#book header { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 14px; border-bottom: 1px solid var(--panel-line); }
#book header b { flex: 1; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#book .follow { font-size: 13px; color: var(--ink-soft); display: flex; gap: 5px; align-items: center; white-space: nowrap; }
#bookabout { padding: 8px 14px 0; font-size: 13px; color: var(--ink-soft); }
#bookabout:empty { display: none; }
#booktopics { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 14px; border-bottom: 1px solid var(--panel-line); max-height: 30vh; overflow: auto; }
#booktopics:empty { display: none; }
#booktopics button { border: 1px solid var(--panel-line); border-radius: 14px; min-height: 28px; padding: 3px 10px; font-size: 12.5px; font-weight: 400; text-align: left; }
#booktopics button b { font-family: "IBM Plex Mono", ui-monospace, monospace; font-weight: 500; margin-right: 4px; }
#booktopics button[aria-current="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
#booknav { display: flex; gap: 4px; align-items: center; padding: 6px 14px; border-bottom: 1px solid var(--panel-line); font-size: 13px; }
#booknav button, #booknav .open { border: 1px solid var(--panel-line); border-radius: 4px; min-height: 30px; padding: 2px 10px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; }
#booknav .open { margin-left: auto; }
#booktocrow { padding: 0 14px; }
#booktoc { width: 100%; margin: 6px 0; font: 13px inherit; padding: 4px 6px; border: 1px solid var(--panel-line); border-radius: 4px; background: var(--paper); color: var(--ink); }
#booktoc[hidden] { display: none; }
#booknav .open:hover { background: var(--hi-soft); }
#bookpage { width: 3.5em; font: 13px "IBM Plex Mono", ui-monospace, monospace; padding: 4px; text-align: center; border: 1px solid var(--panel-line); border-radius: 4px; background: var(--paper); color: var(--ink); }
#bookbody { flex: 1; overflow: auto; background: var(--grid); padding: 10px; }
#bookcanvas { display: block; margin: 0 auto; box-shadow: 0 1px 4px rgba(0,0,0,.25); background: #fff; }
#booknote { margin: 0 0 10px; font-size: 13px; color: var(--ink-soft); }
#booknote:empty { display: none; }

/* memory panel */
#memtools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--panel-line); font-size: 13px; }
#memtools select, #memtools input { font: 13px "IBM Plex Mono", ui-monospace, monospace; border: 1px solid var(--panel-line); border-radius: 4px; background: var(--paper); color: var(--ink); min-height: 32px; padding: 0 6px; }
#memtools input { width: 6em; }
#memtools button { border: 1px solid var(--panel-line); border-radius: 4px; min-height: 32px; padding: 4px 10px; }
#memtools .info { color: var(--ink-soft); flex-basis: 100%; }
table.mem { border-collapse: collapse; font: 12px "IBM Plex Mono", ui-monospace, monospace; margin: 6px 0 10px; }
table.mem th { color: var(--ink-soft); font-weight: 400; padding: 2px 6px; text-align: right; }
table.mem td { padding: 2px 3px; text-align: center; cursor: pointer; border-radius: 3px; }
table.mem td:hover { background: var(--hi-soft); }
table.mem td.zero { color: var(--ink-soft); opacity: .55; }
table.mem td.cur { background: var(--hi); color: #fff; opacity: 1; }
table.mem td input { width: 3.2em; font: inherit; padding: 0 2px; border: 1px solid var(--hi); }

table.try { min-width: 0; margin: 10px 14px; }
table.try th { text-align: right; padding: 4px 10px 4px 0; }
table.try input { font: 13px "IBM Plex Mono", ui-monospace, monospace; width: 9em; padding: 4px 6px; border: 1px solid var(--panel-line); border-radius: 4px; background: var(--paper); color: var(--ink); }
table.try input.bad { border-color: var(--bad); }
table.try td.out { font-weight: 600; padding: 4px 0; white-space: pre; }
table.try td.sep-row { border-top: 1px solid var(--panel-line); padding: 0; height: 8px; }
table.tt { border-collapse: collapse; font: 13px "IBM Plex Mono", ui-monospace, monospace; margin: 0 0 8px; min-width: 100%; }
table.tt th { position: sticky; top: 0; background: var(--panel); font: 600 13px "IBM Plex Sans Condensed", sans-serif; text-align: center; padding: 6px 10px; border-bottom: 1.5px solid var(--ink); }
table.tt td { text-align: center; padding: 3px 10px; border-bottom: 1px solid var(--grid); }
table.tt .sep { border-left: 1.5px solid var(--ink); }
table.tt tr.row { cursor: pointer; }
table.tt tr.row:hover td { background: var(--hi-soft); }
table.tt tr.cur td { background: var(--hi-soft); font-weight: 500; }
table.tt td.one { color: var(--on); font-weight: 500; }

/* drawing */
.part-body { fill: var(--body); stroke: var(--ink); stroke-width: 1.6; }
.part-line { fill: none; stroke: var(--ink); stroke-width: 1.6; }
.part-text { fill: var(--ink); font: 11px "IBM Plex Sans Condensed", sans-serif; }
.part-small { fill: var(--ink-soft); font: 9px "IBM Plex Sans Condensed", sans-serif; }
.part-label { fill: var(--ink); font: 500 12px "IBM Plex Sans Condensed", sans-serif; }
.bitv { font: 500 11px "IBM Plex Mono", monospace; }
.part { cursor: move; }
.part.selected .part-body, .part.selected .sel-ring { stroke: var(--hi); }
.sel-ring { fill: none; stroke: transparent; stroke-width: 2; stroke-dasharray: 4 3; }
.part.selected .sel-ring { stroke: var(--hi); }
.hit { cursor: pointer; }
.part.chip { cursor: pointer; }
.part.chip .part-body { stroke-width: 2; }
.part.chip:hover .part-body { fill: var(--hi-soft); }
.chip-notch { fill: var(--paper); stroke: var(--ink); stroke-width: 1.6; }
.chip-open { fill: none; stroke: var(--ink-soft); stroke-width: 1.4; }
.part-body.pin { stroke-dasharray: 3 2; }
.wire { fill: none; stroke-linecap: square; stroke-linejoin: miter; }
.wire-hit { fill: none; stroke: transparent; stroke-width: 12; cursor: help; }
.wire.lit { filter: drop-shadow(0 0 2px var(--hi)); }
/* the playground's drawing mode: pins to wire from, a wire being drawn */
.pin-hit { fill: transparent; stroke: none; cursor: crosshair; }
.pin-dot { fill: var(--panel); stroke: var(--ink-soft); stroke-width: 1.4; pointer-events: none; }
.pin-hit:hover + .pin-dot, .pin-dot.near { stroke: var(--hi); stroke-width: 2.4; fill: var(--hi-soft); }
#wiring { fill: none; stroke: var(--hi); stroke-width: 2; stroke-dasharray: 6 4; pointer-events: none; }
#sheet.dropping { outline: 3px dashed var(--hi); outline-offset: -8px; }
@media (prefers-reduced-motion: no-preference) {
  .led-glow { transition: opacity .08s; }
}
</style>
</head>
<body>
<svg id="sheet" xmlns="http://www.w3.org/2000/svg" aria-label="Circuit">
  <defs>
    <pattern id="g1" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0H0V10" fill="none" stroke="var(--grid)" stroke-width=".6"/>
    </pattern>
    <pattern id="g5" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="url(#g1)"/>
      <path d="M50 0H0V50" fill="none" stroke="var(--grid-major)" stroke-width=".8"/>
    </pattern>
  </defs>
  <rect id="gridrect" fill="url(#g5)"/>
  <g id="world"><g id="wires"></g><g id="parts"></g><g id="dots"></g></g>
</svg>

<div id="bar">
  <div class="group" id="clockgroup" hidden>
    <button id="run" aria-pressed="false" title="Run the clock">
      <svg viewBox="0 0 14 14"><path id="runicon" d="M3 2l9 5-9 5z" fill="currentColor"/></svg><span id="runlabel">Run</span>
    </button>
    <button id="step" title="One clock cycle">Step</button>
    <select id="speed" aria-label="Clock speed">
      <option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option>
      <option value="4">4×</option><option value="10">10×</option><option value="100">100×</option>
      <option value="1000">1000×</option><option value="10000">10k×</option><option value="100000">100k×</option>
      <option value="1000000">1M×</option><option value="max">Max</option>
    </select>
    <span id="rate" class="mono" title="Clock cycles per second actually simulated"></span>
  </div>
  <div class="group">
    <button id="reset" title="Inputs to 0, flip-flops cleared">Reset</button>
    <button id="tablebtn" title="Truth table">Truth table</button>
    <button id="srcbtn" title="Show the .wire source">Source</button>
    <button id="membtn" title="Contents of the roms and rams" hidden>Memory</button>
    <button id="vhdlbtn" title="The VHDL for this example" hidden>VHDL</button>
    <button id="bookbtn" title="Read the book beside the circuit; the pages follow what you select">Book</button>
  </div>
  <div class="group">
    <button id="fit" title="Fit the circuit on screen">Fit</button>
    <button id="tidy" title="Lay the circuit out again">Tidy</button>
  </div>
  <nav class="group" id="crumbs" aria-label="Where you are" hidden></nav>
  <div id="warn" role="status"></div>
  <span class="spacer"></span>
</div>

<div id="titleblock" aria-label="Title block">
  <div class="name" id="tb-name"></div>
  <div class="k">File</div><div class="v mono" id="tb-file"></div>
  <div class="k">Parts</div><div class="v" id="tb-parts"></div>
  <div class="k">Clock</div><div class="v" id="tb-clock">none</div>
  <div class="k">Showing</div><div class="v" id="tb-view">the circuit</div>
</div>

<div id="tip"></div>
<form id="valform" hidden>
  <label for="valinput" id="vallabel"></label>
  <input id="valinput" autocomplete="off" spellcheck="false" inputmode="text">
  <button type="submit">Set</button>
</form>

<section class="drawer" id="tabledrawer" aria-label="Truth table">
  <header><h2 id="tabletitle">Truth table</h2><button id="tableall" hidden title="Unselect the part and show the whole view">Show all</button><button data-close="tabledrawer">Close</button></header>
  <div class="scroll" id="tablebody"></div>
</section>
<aside id="book" hidden aria-label="Book">
  <header>
    <b id="bookname">Book</b>
    <select id="booksel" aria-label="Which book" hidden></select>
    <label class="follow"><input type="checkbox" id="bookfollow" checked> Follow selection</label>
    <button id="bookclose">Close</button>
  </header>
  <div id="bookabout"></div>
  <div id="booktopics"></div>
  <div id="booknav">
    <button id="bookprev" aria-label="Previous page">‹</button>
    <input id="bookpage" aria-label="Page" inputmode="numeric" autocomplete="off">
    <span id="bookof"></span>
    <button id="booknext" aria-label="Next page">›</button>
    <button id="bookout" aria-label="Smaller">−</button>
    <button id="bookin" aria-label="Larger">+</button>
    <label class="open" title="Read another pdf">Open PDF<input type="file" id="bookfile" accept="application/pdf" hidden></label>
  </div>
  <div id="booktocrow"><select id="booktoc" aria-label="Contents" hidden></select></div>
  <div id="bookbody"><p id="booknote"></p><canvas id="bookcanvas"></canvas></div>
</aside>

<section class="drawer" id="vhdldrawer" aria-label="VHDL">
  <header><h2 id="vhdltitle">VHDL</h2><button id="vhdlcopy" title="Copy the VHDL">Copy</button><button id="vhdlsave" title="Save the VHDL as a .vhd file, for Vivado or GHDL">Save</button><button data-close="vhdldrawer">Close</button></header>
  <div class="note" id="vhdlwhat"></div>
  <div class="scroll"><div id="vhdl"></div></div>
</section>
<section class="drawer" id="memdrawer" aria-label="Memory">
  <header><h2>Memory</h2><button data-close="memdrawer">Close</button></header>
  <div id="memtools">
    <select id="memsel" aria-label="Which memory"></select>
    <button id="memprev" aria-label="Previous 256 words">‹</button>
    <input id="memgo" aria-label="Go to address (hex)" placeholder="addr" spellcheck="false" autocomplete="off">
    <button id="memnext" aria-label="Next 256 words">›</button>
    <span class="info" id="meminfo"></span>
  </div>
  <div class="scroll" id="membody"></div>
</section>
<section class="drawer" id="srcdrawer" aria-label="Source">
  <header><h2 id="srctitle">Source</h2><button data-close="srcdrawer">Close</button></header>
  <div class="scroll"><div id="src"></div></div>
</section>

<script>
"use strict";
const D = /*WIRE_DATA*/;
const BOOKS = /*WIRE_BOOK*/null;
const VHDL = /*WIRE_VHDL*/null;
/* The playground's drawing mode puts window.WIRE_EDIT in the page: where the
 * parts go (by name), the view and the input values to keep. Parts then
 * stay where they are put, pins can be wired by dragging, and every change
 * is handed to the playground (parent.wireCanvas), which rewrites the Wire
 * source and makes the page again. */
const EDIT = window.WIRE_EDIT || null;
function hostCall(fn, ...args) { try { const h = parent !== window && parent.wireCanvas; if (h && h[fn]) return h[fn](...args); } catch (e) {} return undefined; }

/* ================================================================== model */
const SVGNS = "http://www.w3.org/2000/svg";
const nets = D.nets.map((n, i) => ({ id: i, w: n.w, name: n.name, v: 0, k: 0, driver: null, readers: [] }));
const nodes = D.nodes.map((n, i) => Object.assign({ id: i, x: 0, y: 0, state: 0, lastClk: 0 }, n));
const SOURCES = new Set(["input", "button", "clock", "keypad"]);
const MEMS = new Set(["rom", "ram"]);
const SINKS = new Set(["output", "led", "seg7", "hex"]);

/* =============================================================== simulation */

/* =========================================================== truth table */

function buildTable() {

/* One chip as a circuit of its own: everything inside it, its input pins

function chipNetlist(id) {
  const inside = new Set([id]);
  for (let grew = true; grew;) {

    D.insts.forEach((x, i) => { if (!inside.has(i) && inside.has(x.parent)) { inside.add(i); grew = true; } });
  }

  D.nodes.forEach(n => {
    if (!inside.has(n.inst)) return;
    if (SEQ.has(n.kind) || n.kind === "ram" || n.kind === "clock") memory = true;
    if (n.kind === "pin_in" && n.inst === id) {
      ins.push({ node: nodes2.length, name: n.name, w: D.nets[n.out[0]].w, outer: n.in[0] });
      nodes2.push({ ...n, kind: "input", in: [], inNames: [], out: n.out.map(net) });
    } else if (n.kind === "pin_out" && n.inst === id) {

  const nodes2 = [], ins = [];

    if (map.has(i)) return;                       /* the same wire twice is one input */
    const name = (n.inNames && n.inNames[k]) || (n.in.length === 1 ? "in" : letters[k] || "in" + k);
    ins.push({ node: nodes2.length, name, w: D.nets[i].w, outer: i });

/* ================================================================ book */
/* Pdfs read beside the circuit (wire --book, or Open PDF). With "Follow

 * about it in every book and turns to the first: from each book's topics

const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
/* "13-14  The ALU   : *alu* arith" -> { first, last, title, pats } */
function parseTopics(text) {
  const glob = p => new RegExp("^" + p.toLowerCase().split("*").map(x => x.replace(/[.+?^${}()|[\]\\]/g, "\\$&")).join(".*") + "$");
  const out = [];
  for (const line of text.split(/\r?\n/)) {
    /* the patterns follow the last " : " (a colon with space before it; titles may have colons) */
    const m = /^\s*(\d+)(?:\s*-\s*(\d+))?\s+(.*)\s+:(?:\s+(.*?))?\s*$/.exec(line.replace(/#.*$/, ""));
    if (!m) continue;
    out.push({ first: +m[1], last: +(m[2] || m[1]), title: m[3].trim(), pats: (m[4] || "").split(/[\s,]+/).filter(Boolean).map(glob) });
  }

}
/* every book: what the page was built with, and what is loaded */
const books = (Array.isArray(BOOKS) ? BOOKS : []).map(b => ({ ...b, topics: b.topics ? parseTopics(b.topics) : null, doc: null, text: null, loading: null, failed: null, page: 1 }));
const bk = { cur: 0, zoom: 1, rendering: null, task: null };
const book = () => books[bk.cur];

/* what is being looked at: [label, the names to match] */
function bookSubject() {
  const sel = selected;
  if (sel && sel.kind === "chip") return [`${sel.comp}${sel.name ? " " + sel.name : ""}`, [sel.comp, sel.name || ""]];
  if (sel && sel.node && !["pin_in", "pin_out", "split", "merge", "const"].includes(sel.kind))
    return [sel.node.name ? `${sel.node.name} (${kindLabel(sel.node)})` : kindLabel(sel.node), [sel.kind, sel.node.name || ""]];
  if (V && V.id !== 0) return [`${D.insts[V.id].comp}${D.insts[V.id].name ? " " + D.insts[V.id].name : ""}`, [D.insts[V.id].comp, D.insts[V.id].name || ""]];
  const file = baseName(D.file).replace(/\.wire$/, "");
  return [D.title || file, [file]];
}

/* words to search a pdf for, when it has no topics file */
const SEARCH = {
  and: ["AND gate", "AND"], or: ["OR gate", "OR"], nand: ["NAND"], nor: ["NOR"], xor: ["XOR"], xnor: ["XNOR"],
  not: ["inverter", "NOT gate"], buf: ["buffer"], tri: ["tri-state"], bus: ["bus"], mux: ["multiplexer"],
  demux: ["demultiplexer"], decoder: ["decoder"], encoder: ["encoder"], add: ["adder"], compare: ["comparator"],
  dff: ["D flip-flop", "flip-flop"], tff: ["T flip-flop"], jkff: ["JK flip-flop", "JK"], counter: ["counter"],
  rom: ["ROM"], ram: ["RAM"], seg7: ["7-segment", "seven-segment"], hex: ["7-segment", "hexadecimal"],
  keypad: ["keypad", "keyboard"], button: ["debounc", "button"], clock: ["clock"], led: ["LED"]
};
async function searchPages(b, keys) {
  if (!b.text) {
    b.text = [];
    for (let i = 1; i <= b.doc.numPages; i++) {
      const tc = await (await b.doc.getPage(i)).getTextContent();
      b.text.push(tc.items.map(t => t.str).join(" "));
    }
  }
  const words = [];
  keys.filter(Boolean).forEach(k => {
    if (SEARCH[k]) words.push(...SEARCH[k]);
    else k.split(/[_\d\s]+/).filter(w => w.length > 1).forEach(w => words.push(w.length <= 3 ? w.toUpperCase() : w));
  });
  if (!words.length) return [];
  const hits = b.text.map((t, i) => {
    let n = 0;
    for (const w of words) {
      const re = new RegExp(w.length <= 4 && w === w.toUpperCase() ? `\\b${w}\\b` : w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), w === w.toUpperCase() ? "g" : "gi");
      n += (t.match(re) || []).length;
    }
    return { page: i + 1, n };
  }).filter(h => h.n).sort((x, y) => y.n - x.n).slice(0, 8);
  return hits.map(h => ({ first: h.page, last: h.page, title: `${h.n} mention${h.n === 1 ? "" : "s"} of ${words.slice(0, 2).join(" / ")}` }));
}

function loadScript(src) {
  return new Promise((ok, bad) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => bad(new Error("could not load " + src)); document.head.append(s); });
}
async function pdfjs() {
  if (!window.pdfjsLib) {
    await loadScript(PDFJS + "pdf.min.js");
    pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js";
  }
  return window.pdfjsLib;
}
const bookNote = t => { $("booknote").textContent = t || ""; };
async function openBookData(b, data, file) {
  const lib = await pdfjs();
  b.doc = await lib.getDocument({ data }).promise;
  b.text = null;
  b.failed = null;
  if (file) b.picked = file;
  b.toc = await bookContents(b);
}
/* the book's contents: the pdf's own bookmarks if it has them, else the
 * numbered sections of its topics file ("3.7.4 ...", "Chapter 3: ...") */
async function bookContents(b) {
  const out = [];
  try {
    const walk = async (items, depth) => {
      for (const it of items || []) {
        let dest = it.dest;
        if (typeof dest === "string") dest = await b.doc.getDestination(dest);
        if (Array.isArray(dest) && dest[0]) {
          const page = typeof dest[0] === "number" ? dest[0] + 1 : (await b.doc.getPageIndex(dest[0])) + 1;
          out.push({ title: it.title.replace(/\s+/g, " ").trim(), page, depth });
        }
        if (depth < 2) await walk(it.items, depth + 1);
      }
    };
    await walk(await b.doc.getOutline(), 0);
  } catch (e) { out.length = 0; }
  if (out.length) return out;
  return (b.topics || []).filter(t => /^(Chapter \d+|Appendix|[\dA-Z]{1,2}(\.\d+)+ )/.test(t.title))
    .map(t => ({ title: t.title, page: t.first, depth: /^(Chapter|Appendix)/.test(t.title) ? 0 : t.title.split(" ")[0].split(".").length - 1 }));
}
function fillContents() {
  const b = book(), sel = $("booktoc");
  const toc = b && b.doc && b.toc || [];
  sel.hidden = !toc.length;
  if (sel.dataset.for !== String(bk.cur) || sel.options.length !== toc.length + 1) {
    sel.dataset.for = bk.cur;
    sel.textContent = "";
    sel.append(new Option("Contents", ""));
    toc.forEach((t, i) => sel.append(new Option("\u2002".repeat(t.depth * 2) + t.title + "  \u00b7 p." + t.page, i)));
  }
  /* show the section the page is in */
  let at = -1;
  toc.forEach((t, i) => { if (t.page <= b.page) at = i; });
  /* several sections can start on one page: keep the one picked */
  if (b.tocPick !== undefined && toc[b.tocPick] && toc[b.tocPick].page === b.page) at = b.tocPick;
  sel.value = at >= 0 ? at : "";
}
/* load book b (once); on failure, b.failed says why */
async function loadBook(b) {
  if (b.doc) return;
  if (b.loading) return b.loading;
  b.loading = (async () => {
    try {
      if (b.pdf) {
        const bin = atob(b.pdf), data = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) data[i] = bin.charCodeAt(i);
        await openBookData(b, data);
      } else if (b.url) {
        const r = await fetch(b.url);
        if (!r.ok) throw new Error(r.status === 404 ? "it is not on this site" : r.status + " " + r.statusText);
        await openBookData(b, new Uint8Array(await r.arrayBuffer()));
      } else throw new Error("no file");
    } catch (e) {
      b.failed = /could not load/.test(e.message)
        ? "The pdf reader (PDF.js) is loaded from the internet, and that did not work. Check the connection and open the book again."
        : `${b.name} is not loaded here (${e.message}). If you have it, use Open PDF and pick ${b.file}: its pages are already mapped.`;
    }
  })();
  await b.loading;
  b.loading = null;
}
async function renderBook() {
  const b = book();
  $("bookname").textContent = b ? b.name : "Book";
  if (!b) return;
  if (!b.doc) {
    $("bookof").textContent = "";
    $("booktoc").hidden = true;
    $("bookcanvas").style.display = "none";
    bookNote(b.failed || (b.loading ? `Loading ${b.name}...` : ""));
    return;
  }
  bookNote("");
  $("bookcanvas").style.display = "";
  b.page = Math.max(1, Math.min(b.doc.numPages, b.page));
  $("bookpage").value = b.page;
  $("bookof").textContent = `of ${b.doc.numPages}`;
  fillContents();
  [...$("booktopics").children].forEach(x => x.setAttribute("aria-current", +x.dataset.book === bk.cur && b.page >= +x.dataset.first && b.page <= +x.dataset.last));
  const want = b.page, job = Symbol();
  bk.rendering = job;
  const page = await b.doc.getPage(want);
  if (bk.rendering !== job) return;
  const box = $("bookbody"), cv = $("bookcanvas");
  const base = page.getViewport({ scale: 1 });
  const scale = Math.max(.3, (box.clientWidth - 20) / base.width) * bk.zoom;
  const vp = page.getViewport({ scale }), dpr = window.devicePixelRatio || 1;
  /* one drawing at a time on the canvas: stop the one before */
  if (bk.task) { bk.task.cancel(); try { await bk.task.promise; } catch (e) { /* cancelled */ } }
  if (bk.rendering !== job) return;
  cv.width = Math.floor(vp.width * dpr); cv.height = Math.floor(vp.height * dpr);
  cv.style.width = Math.floor(vp.width) + "px"; cv.style.height = Math.floor(vp.height) + "px";
  bk.task = page.render({ canvasContext: cv.getContext("2d"), viewport: vp, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null });
  try { await bk.task.promise; } catch (e) { return; }
  bk.task = null;
  if (bk.rendering === job) box.scrollTop = 0;
}
async function goBook(i, page) {
  bk.cur = i;
  $("booksel").value = i;
  const b = book();
  if (page) b.page = page;
  renderBook();
  await loadBook(b);
  if (bk.cur === i) renderBook();
}
const goPage = p => { book().page = p; renderBook(); };

/* the sections about what is selected (or on screen), from every book;
 * turn to the first one in the book being read, else in the first book that has one */
async function bookFollow(force) {
  if ($("book").hidden || (!force && !$("bookfollow").checked)) return;
  const [label, keys] = bookSubject(), names = keys.filter(Boolean).map(k => k.toLowerCase());
  const found = [];
  for (let i = 0; i < books.length; i++) {
    const b = books[i];
    let list = [];
    if (b.topics) {
      /* a section naming exactly this chip or example comes before one that
       * only matches a wildcard (*reg*); otherwise the file's order */
      const rank = t => Math.min(...t.pats.map(re => names.some(n => re.test(n)) ? (re.source.includes(".*") ? 1 : 0) : 9));
      list = b.topics.map((t, j) => ({ t, j, r: rank(t) })).filter(x => x.r < 9).sort((x, y) => x.r - y.r || x.j - y.j).map(x => x.t);
    }
    else if (b.doc) list = await searchPages(b, keys.slice(0, 1));   /* the kind of part or chip, not its own name */
    list.forEach(t => found.push({ ...t, book: i }));
  }
  const box = $("booktopics");
  box.textContent = "";
  $("bookabout").textContent = found.length ? `About ${label}:` : books.length ? `Nothing in ${books.length > 1 ? "the books" : books[0].name} about ${label}.` : "";
  found.forEach(t => {
    const x = document.createElement("button");
    x.dataset.first = t.first; x.dataset.last = t.last; x.dataset.book = t.book;
    const pg = document.createElement("b");
    pg.textContent = (books.length > 1 ? books[t.book].short + " " : "") + (t.first === t.last ? `p.${t.first}` : `p.${t.first}–${t.last}`);
    x.append(pg, t.title);
    x.onclick = () => goBook(t.book, t.first);
    box.append(x);
  });
  const first = found.find(t => t.book === bk.cur) || found[0];
  if (first) goBook(first.book, first.first); else goBook(bk.cur);
}
function showBook(on) {
  $("book").hidden = !on;
  document.body.classList.toggle("book-open", on);
  $("bookbtn").setAttribute("aria-pressed", on);
  if (on) {
    if (!books.length) {
      books.push({ name: "Book", file: "a pdf", short: "", topics: null, doc: null, page: 1 });
      bookNote("No book in this page. Open a pdf to read it here: it turns to the pages that mention what you select.");
    }
    bookFollow(true);
  }
  requestAnimationFrame(fit);
}
books.forEach((b, i) => {
  b.short = b.name.length <= 12 ? b.name : (b.name.match(/^\S+/) || [b.name])[0];
  const o = document.createElement("option");
  o.value = i; o.textContent = b.name;
  $("booksel").append(o);
});
$("booksel").hidden = books.length < 2;
$("booksel").onchange = () => goBook(+$("booksel").value);
$("bookbtn").onclick = () => showBook($("book").hidden);
$("bookclose").onclick = () => showBook(false);
$("bookfollow").onchange = () => { if ($("bookfollow").checked) bookFollow(); };
$("booktoc").onchange = () => {
  const t = (book().toc || [])[+$("booktoc").value];
  if (t) { book().tocPick = +$("booktoc").value; goBook(bk.cur, t.page); }
};
$("bookprev").onclick = () => goPage(book().page - 1);
$("booknext").onclick = () => goPage(book().page + 1);
$("bookin").onclick = () => { bk.zoom = Math.min(3, bk.zoom * 1.25); renderBook(); };
$("bookout").onclick = () => { bk.zoom = Math.max(.5, bk.zoom / 1.25); renderBook(); };
$("bookpage").onkeydown = e => { e.stopPropagation(); if (e.key === "Enter") goPage(parseInt($("bookpage").value, 10) || 1); };
/* Open PDF reads a pdf into the book being shown, keeping its topics */
$("bookfile").onchange = async () => {
  const f = $("bookfile").files[0], b = book();
  if (!f || !b) return;
  try { await openBookData(b, new Uint8Array(await f.arrayBuffer()), f.name); if (b.file === "a pdf") { b.name = f.name; } bookFollow(true); }
  catch (e) { bookNote(`Could not open ${f.name}: ${e.message}`); }
};
addEventListener("resize", () => { if (!$("book").hidden) renderBook(); });

/* ================================================================ VHDL */
/* The example's VHDL (the .vhd next to the .wire file). Selecting a chip,
 * or opening one, lights up the entity of the same name; at the top, the
 * entity named like the file. */
const vhdlLines = VHDL ? VHDL.text.replace(/\r/g, "").split("\n") : [];
let vhdlOpen = false;
/* entity name -> [first line, last line] (to the next library/entity/use at the top) */
const vhdlBlocks = (() => {
  const m = new Map(), starts = [];
  vhdlLines.forEach((l, i) => { const e = /^\s*entity\s+(\w+)\s+is\b/i.exec(l); if (e) starts.push([e[1].toLowerCase(), i]); });
  starts.forEach(([name, at], k) => {
    /* back up over the comments and library lines just before it */
    let first = at;
    while (first > 0 && /^\s*(--|library\b|use\b|$)/i.test(vhdlLines[first - 1]) && !(k && first - 1 <= starts[k - 1][1])) first--;
    while (first < at && /^\s*$/.test(vhdlLines[first])) first++;
    let last = k + 1 < starts.length ? starts[k + 1][1] - 1 : vhdlLines.length - 1;
    while (last > at && /^\s*(--|library\b|use\b|$)/i.test(vhdlLines[last])) last--;
    m.set(name, [first, last]);
  });
  return m;
})();
const VHDL_KW = new Set(("abs access after alias all and architecture array assert attribute begin block body buffer bus case component configuration constant disconnect downto else elsif end entity exit file for function generate generic group guarded if impure in inertial inout is label library linkage literal loop map mod nand new next nor not null of on open or others out package port postponed procedure process pure range record register reject rem report return rol ror select severity signal shared sla sll sra srl subtype then to transport type unaffected units until use variable wait when while with xnor xor rising_edge falling_edge std_logic std_logic_vector unsigned signed integer natural boolean").split(" "));
function buildVhdl() {
  const box = $("vhdl");
  box.textContent = "";
  vhdlLines.forEach((line, i) => {
    const row = document.createElement("div"); row.className = "ln"; row.dataset.n = i;
    const no = document.createElement("span"); no.className = "no"; no.textContent = i + 1;
    const tx = document.createElement("span"); tx.className = "tx";
    /* comments, strings and keywords */
    const c = line.indexOf("--");
    const code = c >= 0 ? line.slice(0, c) : line;
    code.split(/(\b\w+\b|"[^"]*"|'[^']')/).forEach(part => {
      if (!part) return;
      if (VHDL_KW.has(part.toLowerCase())) { const k = document.createElement("b"); k.textContent = part; tx.append(k); }
      else if (/^["']/.test(part)) { const k = document.createElement("i"); k.textContent = part; tx.append(k); }
      else tx.append(part);
    });
    if (c >= 0) { const k = document.createElement("span"); k.className = "cm"; k.textContent = line.slice(c); tx.append(k); }
    row.append(no, tx);
    box.append(row);
  });
  $("vhdltitle").textContent = VHDL.name;
  markVhdl();
}
function markVhdl() {
  if (!vhdlOpen) return;
  /* the selected chip, else the chip on screen, else the circuit; reg_n4
   * (Wire has no generics) is entity reg_n */
  const sel = selected, names = [];
  if (sel && sel.kind === "chip") names.push(sel.comp);
  if (V && V.id !== 0) names.push(D.insts[V.id].comp);
  names.push(baseName(D.file).replace(/\.wire$/, ""));
  let name, r;
  for (const n of names) {
    /* the VHDL Wire makes renames a component that is a VHDL word (_s) or
     * named like the file (_c) */
    for (const k of [n, n.replace(/_?\d+$/, ""), n + "_s", n + "_c"]) if (!r && vhdlBlocks.has(k.toLowerCase())) { name = k; r = vhdlBlocks.get(k.toLowerCase()); }
    if (r) break;
  }
  const rows = $("vhdl").children;
  for (let i = 0; i < rows.length; i++) rows[i].classList.toggle("sel", !!r && i >= r[0] && i <= r[1]);
  $("vhdlwhat").textContent = r ? `entity ${name}, lines ${r[0] + 1}–${r[1] + 1}` : "";
  if (r && rows[r[0]]) rows[r[0]].scrollIntoView({ block: "start" });
}
if (VHDL) {
  $("vhdlbtn").hidden = false;
  $("vhdlbtn").onclick = () => { if (vhdlOpen) return openDrawer(null); openDrawer("vhdldrawer"); };
  $("vhdlcopy").onclick = () => {
    const done = () => { $("vhdlcopy").textContent = "Copied"; setTimeout(() => { $("vhdlcopy").textContent = "Copy"; }, 1200); };
    if (navigator.clipboard) navigator.clipboard.writeText(VHDL.text).then(done, () => {});
  };
  $("vhdlsave").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([VHDL.text], { type: "text/x-vhdl" }));
    a.download = VHDL.name.replace(/\s*\(.*\)\s*$/, "");
    document.body.append(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  };
  if (VHDL.generated) $("vhdlbtn").title = "VHDL for this circuit, made by Wire (VHDL-93, ready for Vivado)";
}

/* ================================================================ start */
document.title = D.title || D.file;
$("tb-name").textContent = D.title || D.file.replace(/\.wire$/, "");
$("tb-file").textContent = baseName(D.file);
const comps = nodes.filter(n => !SOURCES.has(n.kind) && !SINKS.has(n.kind) && !["split", "merge", "const", "pin_in", "pin_out", "bus"].includes(n.kind)).length;
const chips = D.insts ? D.insts.length - 1 : 0;
$("tb-parts").textContent = `${comps} part${comps === 1 ? "" : "s"}${chips ? `, ${chips} chip${chips === 1 ? "" : "s"}` : ""}, ${ttIn.length + clocks.length} in, ${ttOut.length} out`;

WireSim.create(D).then(s => {
  bindSim(s);
  nets.forEach(n => { n.v = 0; n.k = mask(n.w); });
  if (EDIT && EDIT.states) nodes.forEach(n => {
    if (SOURCES.has(n.kind) && n.name in EDIT.states) n.state = EDIT.states[n.name] & mask(nets[n.out[0]].w);
  });
  openView(0);
  simulate();
}).catch(e => {
  const w = $("warn");
  w.style.display = "block";
  w.textContent = "This browser could not run the simulator (WebAssembly): " + e.message;
});
$("fit").onclick = fit;
$("tidy").onclick = () => {
  shared.delete(compOf(V.id));
  try { localStorage.removeItem(keyBase + compOf(V.id)); } catch (e) {}
  layout(V);
  V.items.forEach(place);
  drawWires();
  fit();
  if (editing()) hostCall("movedAll", Object.fromEntries(V.items.filter(n => n.name).map(n => [n.name, [n.x, n.y]])));
};
addEventListener("resize", applyView);
/* with a keypad, the keys 0-9 and a-f press it */
const keypad = nodes.find(n => n.kind === "keypad");
const hexKey = e => /^[0-9a-f]$/i.test(e.key) && !e.ctrlKey && !e.metaKey && !e.altKey ? parseInt(e.key, 16) : -1;
addEventListener("keyup", e => {
  if (keypad && sim && hexKey(e) >= 0 && (keypad.state & 16) && (keypad.state & 15) === hexKey(e)) { keypad.state &= 15; simulate(); }
});
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if (keypad && sim && hexKey(e) >= 0) { if (!e.repeat) { keypad.state = 16 | hexKey(e); simulate(); } return; }
  if (e.key === " " && clocks.length) { e.preventDefault(); stepClock(); }
  if (e.key === "f") fit();
  if (e.key === "Escape") {
    if (document.querySelector(".drawer.open")) openDrawer(null);
    else if (V.id !== 0) goUp();
    else select(null);
  }
  if (editing() && (e.key === "Delete" || e.key === "Backspace") && selected && selected.name) { e.preventDefault(); hostCall("remove", selected.name); return; }
  if (editing() && (e.key === "z" || e.key === "Z") && (e.ctrlKey || e.metaKey)) { e.preventDefault(); hostCall("undo"); return; }
  if (e.key === "Backspace") goUp();
});
/* where every part of the circuit is drawn now, by node: the playground uses
 * it to keep the layout when a written circuit becomes a drawing */
window.wireLayout = () => {
  const v = views.get(0);
  if (!v) return null;
  const at = {};
  v.items.forEach(it => { if (it.node && it.node.id != null) at[it.node.id] = [it.x, it.y]; else if (it.kind === "chip") at["i" + it.inst] = [it.x, it.y]; });
  return at;
};
/* drawing mode: parts dropped from the playground's palette */
if (EDIT) {
  const takes = e => e.dataTransfer && [...e.dataTransfer.types].includes("text/x-wire-part");
  sheet.addEventListener("dragover", e => { if (takes(e)) { e.preventDefault(); e.dataTransfer.dropEffect = "copy"; sheet.classList.add("dropping"); } });
  sheet.addEventListener("dragleave", () => sheet.classList.remove("dropping"));
  sheet.addEventListener("drop", e => {
    sheet.classList.remove("dropping");
    if (!takes(e)) return;
    e.preventDefault();
    const w = toWorld(e.clientX, e.clientY);
    hostCall("add", e.dataTransfer.getData("text/x-wire-part"), Math.round(w.x / 10) * 10, Math.round(w.y / 10) * 10);
  });
  /* what the playground keeps when it makes the page again */
  window.wireEditState = () => ({
    view: Object.assign({}, view),
    states: Object.fromEntries(nodes.filter(n => SOURCES.has(n.kind) && n.kind !== "clock" && n.name).map(n => [n.name, n.state]))
  });
  window.wireCentre = () => toWorld(sheet.clientWidth / 2, sheet.clientHeight / 2);
}
