<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wire circuit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap">
<style>
:root {
  --paper: #f3f6f8;
  --grid: #dfe6ec;
  --grid-major: #cfd9e2;
  --ink: #1d2b3a;
  --ink-soft: #5b6b7c;
  --body: #ffffff;
  --panel: #ffffff;
  --panel-line: #c9d3dc;
  --hi: #e09a12;           /* selection, LEDs */
  --hi-soft: rgba(224,154,18,.18);
  --on: #1fae4b;           /* a 1 on a wire */
  --off: #155c2c;          /* a 0 on a wire */
  --unknown: #2f6fd6;
  --bus: #1d2b3a;
  --bad: #c8322b;
  --seg-on: #e2321f;
  --seg-off: #e9eef2;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121a23; --grid: #1a2430; --grid-major: #222e3c;
    --ink: #d4dde7; --ink-soft: #8797a8; --body: #18222d; --panel: #18222d; --panel-line: #2c3a4a;
    --hi: #f0b23a; --hi-soft: rgba(240,178,58,.2);
    --on: #3ddc6f; --off: #1f5c34; --unknown: #5b93f0; --bus: #c7d2de; --bad: #ef5a52;
    --seg-on: #ff4a33; --seg-off: #222e3a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121a23; --grid: #1a2430; --grid-major: #222e3c;
  --ink: #d4dde7; --ink-soft: #8797a8; --body: #18222d; --panel: #18222d; --panel-line: #2c3a4a;
  --hi: #f0b23a; --hi-soft: rgba(240,178,58,.2);
  --on: #3ddc6f; --off: #1f5c34; --unknown: #5b93f0; --bus: #c7d2de; --bad: #ef5a52;
  --seg-on: #ff4a33; --seg-off: #222e3a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font: 15px/1.4 "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
#sheet { position: fixed; inset: 0; touch-action: none; cursor: grab; display: block; width: 100%; height: 100%; }
#sheet.panning { cursor: grabbing; }
.mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }

/* the toolbar sits on the sheet like a strip of tape */
#bar {
  position: fixed; top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px;
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center; pointer-events: none;
}
#bar > * { pointer-events: auto; }
.group { display: flex; gap: 0; border: 1px solid var(--panel-line); background: var(--panel); border-radius: 6px; overflow: hidden; }
.group button + button { border-left: 1px solid var(--panel-line); }
button {
  font: inherit; font-weight: 500; color: var(--ink); background: transparent; border: 0;
  padding: 7px 12px; min-height: 36px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
}
button:hover { background: var(--hi-soft); }
button:focus-visible { outline: 2px solid var(--hi); outline-offset: -2px; }
button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
button svg { width: 14px; height: 14px; }
#rate { align-self: center; padding: 0 10px 0 4px; font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
#rate:empty { display: none; }
select { font: inherit; color: var(--ink); background: transparent; border: 0; border-left: 1px solid var(--panel-line); padding: 0 8px; min-height: 36px; }
.spacer { flex: 1; pointer-events: none; }
#crumbs button { gap: 5px; }
#crumbs button + button::before { content: "›"; color: var(--ink-soft); margin-right: 4px; }
#crumbs small { color: var(--ink-soft); font-size: 12px; font-weight: 400; }
#crumbs button[aria-current] { background: var(--hi-soft); cursor: default; }
#warn {
  display: none; background: var(--bad); color: #fff; border-radius: 6px; padding: 7px 12px; font-weight: 500;
}

/* the drafting title block, bottom right */
#titleblock {
  position: fixed; right: 10px; bottom: max(10px, env(safe-area-inset-bottom));
  background: var(--panel); border: 1.5px solid var(--ink); min-width: 230px; max-width: min(360px, calc(100vw - 20px));
  display: grid; grid-template-columns: auto 1fr; font-size: 12px; pointer-events: auto;
}
#titleblock > div { padding: 4px 8px; border-top: 1px solid var(--ink); }
#titleblock .k { color: var(--ink-soft); border-right: 1px solid var(--ink); }
#titleblock .name { grid-column: 1 / -1; border-top: 0; font-size: 19px; font-weight: 600; line-height: 1.15; padding: 7px 8px 6px; letter-spacing: -.01em; }
#titleblock .v { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* tooltip for wires */
#tip {
  position: fixed; pointer-events: none; display: none; background: var(--ink); color: var(--paper);
  padding: 5px 8px; border-radius: 4px; font-size: 12px; white-space: nowrap; z-index: 5;
}
#tip b { font-weight: 600; }

#valform {
  position: fixed; z-index: 6; display: flex; gap: 6px; align-items: center; background: var(--panel);
  border: 1.5px solid var(--ink); padding: 6px 6px 6px 10px; font-size: 13px; flex-wrap: wrap; max-width: calc(100vw - 20px);
}
#valform input { font: 14px "IBM Plex Mono", ui-monospace, monospace; width: 9em; padding: 6px 8px; border: 1px solid var(--panel-line); background: var(--paper); color: var(--ink); border-radius: 4px; }
#valform input:focus-visible { outline: 2px solid var(--hi); }
#valform button { border: 1px solid var(--panel-line); border-radius: 4px; min-height: 32px; }
#valform.bad input { border-color: var(--bad); }

/* sheets that slide up: truth table and source */
.drawer {
  position: fixed; left: 0; right: 0; bottom: 0; max-height: 58vh; background: var(--panel);
  border-top: 1.5px solid var(--ink); display: none; flex-direction: column; z-index: 4;
  padding-bottom: env(safe-area-inset-bottom);
}
.drawer.open { display: flex; }
@media (min-width: 900px) {
  .drawer { left: auto; top: 0; width: 420px; max-height: none; border-top: 0; border-left: 1.5px solid var(--ink); }
}
.drawer header { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 14px; border-bottom: 1px solid var(--panel-line); }
.drawer header h2 { font-size: 16px; font-weight: 600; margin: 0; flex: 1; }
.drawer .scroll { overflow: auto; flex: 1; }
.drawer .note { padding: 10px 14px; color: var(--ink-soft); max-width: 60ch; }

#src { margin: 0; padding: 8px 0; font: 13px/1.55 "IBM Plex Mono", ui-monospace, monospace; }
#src .ln { display: flex; padding: 0 14px 0 0; cursor: pointer; }
#src .ln:hover { background: var(--hi-soft); }
#src .ln.sel { background: var(--hi-soft); box-shadow: inset 3px 0 var(--hi); }
#src .no { width: 3.2em; text-align: right; padding-right: 1em; color: var(--ink-soft); flex: none; user-select: none; }
#src .tx { white-space: pre; }
#src .cm { color: var(--ink-soft); }

table.tt { border-collapse: collapse; font: 13px "IBM Plex Mono", ui-monospace, monospace; margin: 0 0 8px; min-width: 100%; }
table.tt th { position: sticky; top: 0; background: var(--panel); font: 600 13px "IBM Plex Sans Condensed", sans-serif; text-align: center; padding: 6px 10px; border-bottom: 1.5px solid var(--ink); }
table.tt td { text-align: center; padding: 3px 10px; border-bottom: 1px solid var(--grid); }
table.tt .sep { border-left: 1.5px solid var(--ink); }
table.tt tr.row { cursor: pointer; }
table.tt tr.row:hover td { background: var(--hi-soft); }
table.tt tr.cur td { background: var(--hi-soft); font-weight: 500; }
table.tt td.one { color: var(--on); font-weight: 500; }

/* drawing */
.part-body { fill: var(--body); stroke: var(--ink); stroke-width: 1.6; }
.part-line { fill: none; stroke: var(--ink); stroke-width: 1.6; }
.part-text { fill: var(--ink); font: 11px "IBM Plex Sans Condensed", sans-serif; }
.part-small { fill: var(--ink-soft); font: 9px "IBM Plex Sans Condensed", sans-serif; }
.part-label { fill: var(--ink); font: 500 12px "IBM Plex Sans Condensed", sans-serif; }
.bitv { font: 500 11px "IBM Plex Mono", monospace; }
.part { cursor: move; }
.part.selected .part-body, .part.selected .sel-ring { stroke: var(--hi); }
.sel-ring { fill: none; stroke: transparent; stroke-width: 2; stroke-dasharray: 4 3; }
.part.selected .sel-ring { stroke: var(--hi); }
.hit { cursor: pointer; }
.part.chip { cursor: pointer; }
.part.chip .part-body { stroke-width: 2; }
.part.chip:hover .part-body { fill: var(--hi-soft); }
.chip-notch { fill: var(--paper); stroke: var(--ink); stroke-width: 1.6; }
.chip-open { fill: none; stroke: var(--ink-soft); stroke-width: 1.4; }
.part-body.pin { stroke-dasharray: 3 2; }
.wire { fill: none; stroke-linecap: square; stroke-linejoin: miter; }
.wire-hit { fill: none; stroke: transparent; stroke-width: 12; cursor: help; }
.wire.lit { filter: drop-shadow(0 0 2px var(--hi)); }
@media (prefers-reduced-motion: no-preference) {
  .led-glow { transition: opacity .08s; }
}
</style>
</head>
<body>
<svg id="sheet" xmlns="http://www.w3.org/2000/svg" aria-label="Circuit">
  <defs>
    <pattern id="g1" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0H0V10" fill="none" stroke="var(--grid)" stroke-width=".6"/>
    </pattern>
    <pattern id="g5" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="url(#g1)"/>
      <path d="M50 0H0V50" fill="none" stroke="var(--grid-major)" stroke-width=".8"/>
    </pattern>
  </defs>
  <rect id="gridrect" fill="url(#g5)"/>
  <g id="world"><g id="wires"></g><g id="parts"></g><g id="dots"></g></g>
</svg>

<div id="bar">
  <div class="group" id="clockgroup" hidden>
    <button id="run" aria-pressed="false" title="Run the clock">
      <svg viewBox="0 0 14 14"><path id="runicon" d="M3 2l9 5-9 5z" fill="currentColor"/></svg><span id="runlabel">Run</span>
    </button>
    <button id="step" title="One clock cycle">Step</button>
    <select id="speed" aria-label="Clock speed">
      <option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option>
      <option value="4">4×</option><option value="10">10×</option><option value="100">100×</option>
      <option value="1000">1000×</option><option value="10000">10k×</option><option value="100000">100k×</option>
      <option value="1000000">1M×</option><option value="max">Max</option>
    </select>
    <span id="rate" class="mono" title="Clock cycles per second actually simulated"></span>
  </div>
  <div class="group">
    <button id="reset" title="Inputs to 0, flip-flops cleared">Reset</button>
    <button id="tablebtn" title="Truth table">Truth table</button>
    <button id="srcbtn" title="Show the .wire source">Source</button>
  </div>
  <div class="group">
    <button id="fit" title="Fit the circuit on screen">Fit</button>
    <button id="tidy" title="Lay the circuit out again">Tidy</button>
  </div>
  <nav class="group" id="crumbs" aria-label="Where you are" hidden></nav>
  <div id="warn" role="status"></div>
  <span class="spacer"></span>
</div>

<div id="titleblock" aria-label="Title block">
  <div class="name" id="tb-name"></div>
  <div class="k">File</div><div class="v mono" id="tb-file"></div>
  <div class="k">Parts</div><div class="v" id="tb-parts"></div>
  <div class="k">Clock</div><div class="v" id="tb-clock">none</div>
  <div class="k">Showing</div><div class="v" id="tb-view">the circuit</div>
</div>

<div id="tip"></div>
<form id="valform" hidden>
  <label for="valinput" id="vallabel"></label>
  <input id="valinput" autocomplete="off" spellcheck="false" inputmode="text">
  <button type="submit">Set</button>
</form>

<section class="drawer" id="tabledrawer" aria-label="Truth table">
  <header><h2>Truth table</h2><button data-close="tabledrawer">Close</button></header>
  <div class="scroll" id="tablebody"></div>
</section>
<section class="drawer" id="srcdrawer" aria-label="Source">
  <header><h2 id="srctitle">Source</h2><button data-close="srcdrawer">Close</button></header>
  <div class="scroll"><div id="src"></div></div>
</section>

<script>
"use strict";
const D = /*WIRE_DATA*/;

/* ================================================================== model */
const SVGNS = "http://www.w3.org/2000/svg";
const nets = D.nets.map((n, i) => ({ id: i, w: n.w, name: n.name, v: 0, k: 0, driver: null, readers: [] }));
const nodes = D.nodes.map((n, i) => Object.assign({ id: i, x: 0, y: 0, state: 0, lastClk: 0 }, n));
const SOURCES = new Set(["input", "button", "clock"]);
const SINKS = new Set(["output", "led", "seg7", "hex"]);
const SEQ = new Set(["dff", "tff", "jkff", "counter"]);
const GATES = new Set(["and", "or", "nand", "nor", "xor", "xnor"]);
nodes.forEach(n => {
  n.out.forEach((net, p) => { nets[net].driver = { node: n.id, port: p }; });
  n.in.forEach((net, p) => nets[net].readers.push({ node: n.id, port: p }));
});

const mask = w => w >= 32 ? 0xFFFFFFFF : ((1 << w) >>> 0) - 1;
const u32 = x => x >>> 0;

/* ================================================================ geometry */
/* every part: size, and where its ports are (inputs left, outputs right) */
function geom(n) {
  const k = n.kind, ni = n.in.length, no = n.out.length;
  const g = { w: 60, h: 40, ins: [], outs: [] };
  const left = (y, name) => g.ins.push({ x: 0, y, name });
  const right = (y, name) => g.outs.push({ x: g.w, y, name });
  if (GATES.has(k)) {
    g.w = 60; g.h = Math.max(40, ni * 20);
    for (let i = 0; i < ni; i++) left(10 + i * 20 + (ni === 2 ? 0 : 0));
    if (ni === 2) { g.ins[0].y = 10; g.ins[1].y = 30; }
    right(g.h / 2);
  } else if (k === "not" || k === "buf") {
    g.w = 40; g.h = 20; left(10); right(10);
  } else if (k === "mux") {
    const nd = ni - 1;
    g.w = 40; g.h = nd * 20 + 30;
    for (let i = 0; i < nd; i++) left(10 + i * 20, String(i));
    left(nd * 20 + 20, "sel");
    right(nd * 10 + (nd % 2 ? 0 : 0));
    g.outs[0].y = Math.round(nd * 20 / 2 / 10) * 10;
  } else if (k === "demux") {
    g.w = 40; g.h = no * 20 + 30;
    left(Math.round(no * 10 / 10) * 10, "d");
    left(no * 20 + 20, "sel");
    for (let i = 0; i < no; i++) right(10 + i * 20, String(i));
  } else if (k === "decoder" || k === "encoder" || k === "add" || k === "compare" || SEQ.has(k)) {
    g.w = SEQ.has(k) ? 60 : 50;
    const top = SEQ.has(k) || k === "add" ? 20 : 30;     /* room for the title on top */
    const rows = Math.max(ni, no, SEQ.has(k) ? 3 : 2);
    g.h = rows * 20 + top;
    n.in.forEach((_, i) => left(top + i * 20, n.inNames[i]));
    if (no === 2 && rows > 2 && SEQ.has(k)) { right(top, n.outNames[0]); right(g.h - 20, n.outNames[1]); }
    else n.out.forEach((_, i) => right(top + i * 20, n.outNames[i]));
  } else if (k === "split") {
    const order = n.ranges.map((r, i) => i).sort((a, b) => n.ranges[a][1] - n.ranges[b][1]);
    g.w = 30; g.h = Math.max(20, no * 20);
    g.outs = new Array(no);
    order.forEach((p, slot) => { g.outs[p] = { x: 30, y: 10 + slot * 20 }; });
    left(Math.floor(g.h / 20) * 10);
    if (no === 1) g.ins[0].y = 10;
  } else if (k === "merge") {
    const order = n.ranges.map((r, i) => i).sort((a, b) => n.ranges[a][1] - n.ranges[b][1]);
    g.w = 30; g.h = Math.max(20, ni * 20);
    g.ins = new Array(ni);
    order.forEach((p, slot) => { g.ins[p] = { x: 0, y: 10 + slot * 20 }; });
    right(Math.floor(g.h / 20) * 10);
    if (ni === 1) g.outs[0].y = 10;
  } else if (k === "const") {
    const t = constText(n);
    g.w = Math.max(20, Math.ceil((t.length * 7 + 10) / 10) * 10); g.h = 20; right(10);
  } else if (k === "input" || k === "output" || k === "pin_in" || k === "pin_out") {
    const isIn = k === "input" || k === "pin_in";
    const w = nets[isIn ? n.out[0] : n.in[0]].w;
    if (w === 1) { g.w = 30; g.h = 20; }
    else { g.w = Math.ceil((w * 13 + 10) / 10) * 10; g.h = 40; }
    if (isIn) right(g.h === 20 ? 10 : 20); else left(g.h === 20 ? 10 : 20);
  } else if (k === "chip") {
    const rows = Math.max(ni, no, 1);
    const longest = Math.max(...n.inNames.map(x => x.length), 0) + Math.max(...n.outNames.map(x => x.length), 0);
    g.w = Math.max(80, Math.ceil((longest * 6.5 + 36) / 10) * 10, Math.ceil((n.comp.length * 7.5 + 24) / 10) * 10);
    g.h = rows * 20 + 30;
    n.in.forEach((_, i) => left(30 + i * 20, n.inNames[i]));
    n.out.forEach((_, i) => right(30 + i * 20, n.outNames[i]));
  } else if (k === "button" || k === "clock") {
    g.w = 30; g.h = 20; right(10);
  } else if (k === "led") {
    g.w = 20; g.h = 20; left(10);
  } else if (k === "seg7" || k === "hex") {
    g.w = 40; g.h = 60; left(30);
  }
  return g;
}
function constText(n) {
  const w = nets[n.out[0]].w;
  return w <= 4 ? n.value.toString(2).padStart(w, "0") : "0x" + n.value.toString(16).toUpperCase();
}

/* =============================================================== simulation */
/* The simulator is the netlist compiled to WebAssembly by wire_sim.js
 * (pasted in below when wire is built). Every net's value and known mask
 * and every part's state live in its memory; the properties set up in
 * bindSim read and write that memory, so the drawing code just uses
 * net.v, net.k and node.state. In the console, wireSim.dump() shows where
 * each net lives and the order the logic runs in. */
//@include wire_sim.js
const known = net => net.k === mask(net.w);
const seqNodes = nodes.filter(n => SEQ.has(n.kind));
let sim = null, unstable = false;
function bindSim(s) {
  sim = s;
  const m = s.mem, c = s.compiled;
  nets.forEach((net, i) => {
    const a = c.V(i) >> 2, b = c.K(i) >> 2;
    Object.defineProperty(net, "v", { get: () => m[a] >>> 0, set: x => { m[a] = x; } });
    Object.defineProperty(net, "k", { get: () => m[b] >>> 0, set: x => { m[b] = x; } });
  });
  nodes.forEach((n, j) => {
    const a = c.S(j) >> 2, b = c.LC(j) >> 2;
    Object.defineProperty(n, "state", { get: () => m[a] >>> 0, set: x => { m[a] = x; } });
    Object.defineProperty(n, "lastClk", { get: () => m[b], set: x => { m[b] = x; } });
  });
  window.wireSim = s;
}
/* evaluate the logic; returns false if it never settles */
function settle() { unstable = !sim.settle(); return !unstable; }
/* settle, clock the flip-flops that saw a rising edge, and draw */
function simulate() { unstable = !sim.simulate(); redraw(); }

/* ================================================================== graph */
/* items have .vi (their index) .in .out (nets); drv: net -> {node: vi, port} */
function graphOf(items, drv) {
  const N = items.length, edges = [];
  items.forEach(v => v.in.forEach((net, p) => {
    const d = drv.get(net); if (d) edges.push({ u: d.node, v: v.vi, net, p });
  }));
  const outE = items.map(() => []), inE = items.map(() => []);
  edges.forEach((e, i) => { outE[e.u].push(i); inE[e.v].push(i); });
  /* depth-first search from the inputs marks the edges that close a loop */
  const back = new Set(), state = new Array(N).fill(0);
  const visit = s => {
    const stack = [[s, 0]]; state[s] = 1;
    while (stack.length) {
      const top = stack[stack.length - 1], u = top[0];
      if (top[1] < outE[u].length) {
        const ei = outE[u][top[1]++], v = edges[ei].v;
        if (state[v] === 1) back.add(ei);
        else if (state[v] === 0) { state[v] = 1; stack.push([v, 0]); }
      } else { state[u] = 2; stack.pop(); }
    }
  };
  items.filter(n => isSrc(n)).forEach(n => { if (!state[n.vi]) visit(n.vi); });
  items.filter(n => n.kind === "const").forEach(n => { if (!state[n.vi]) visit(n.vi); });
  items.forEach(n => { if (!state[n.vi]) visit(n.vi); });
  const indeg = new Array(N).fill(0);
  edges.forEach((e, i) => { if (!back.has(i)) indeg[e.v]++; });
  const topo = [], q = items.filter(n => !indeg[n.vi]).map(n => n.vi);
  while (q.length) {
    const u = q.shift(); topo.push(u);
    outE[u].forEach(ei => { if (!back.has(ei) && --indeg[edges[ei].v] === 0) q.push(edges[ei].v); });
  }
  return { edges, outE, inE, back, topo };
}
const isSrc = n => SOURCES.has(n.kind) || n.kind === "pin_in";
const isSink = n => SINKS.has(n.kind) || n.kind === "pin_out";

/* ================================================================== views */
/* A view is one instance seen from inside: its own parts, its input and
 * output pins, and each component used in it as one chip. The simulation
 * runs on the flat netlist; a view only chooses what to draw. */
const views = new Map();
let V = null;                 /* the view on screen */
function makeView(id) {
  const items = [], wrap = (n, extra) => Object.assign(Object.create(n), { node: n }, extra);

}
function stepClock() {
  if (timer) setRun(false);
  clocks.forEach(c => { c.state = 1; }); simulate();
  clocks.forEach(c => { c.state = 0; }); simulate();
}
if (clocks.length) {
  $("clockgroup").hidden = false;
  $("tb-clock").textContent = clocks.map(c => `${c.name} ${+c.hz} Hz`).join(", ");
}
$("run").onclick = () => setRun(!timer);
$("step").onclick = stepClock;
$("speed").onchange = () => { if (timer) setRun(true); };
$("reset").onclick = () => {
  setRun(false);
  nodes.forEach(n => { if (SOURCES.has(n.kind) || SEQ.has(n.kind)) n.state = 0; n.lastClk = 0; });
  nets.forEach(n => { n.v = 0; n.k = mask(n.w); });
  simulate();
};

/* =========================================================== truth table */
const ttIn = nodes.filter(n => n.kind === "input" || n.kind === "button");
const ttOut = nodes.filter(n => SINKS.has(n.kind));
const ttBits = ttIn.reduce((s, n) => s + nets[n.out[0]].w, 0);
let tableOpen = false, tableRows = [];
function buildTable() {
  const box = $("tablebody");
  box.textContent = "";
  const note = t => { const p = document.createElement("p"); p.className = "note"; p.textContent = t; box.append(p); };
  if (seqNodes.length || clocks.length) return note("This circuit has memory (flip-flops or a clock), so its outputs depend on more than the inputs. Truth tables are for circuits without memory.");
  if (!ttIn.length) return note("This circuit has no inputs.");
  if (ttBits > 12) return note(`The inputs add up to ${ttBits} bits, which is ${2 ** ttBits} rows. Truth tables are shown up to 12 input bits.`);
  const saved = ttIn.map(n => n.state);
  const t = document.createElement("table"); t.className = "tt";
  const hr = t.insertRow();
  ttIn.forEach(n => { const th = document.createElement("th"); th.textContent = n.name; hr.append(th); });
  ttOut.forEach((n, i) => { const th = document.createElement("th"); th.textContent = n.name; if (!i) th.className = "sep"; hr.append(th); });
  tableRows = [];
  for (let r = 0; r < 2 ** ttBits; r++) {
    let shift = ttBits;
    const vals = ttIn.map(n => { const w = nets[n.out[0]].w; shift -= w; return (r >>> shift) & mask(w); });
    ttIn.forEach((n, i) => { n.state = vals[i]; });
    settle();
    const tr = t.insertRow(); tr.className = "row";
    const cell = (net, v, sep) => {
      const td = tr.insertCell();
      td.textContent = net.w === 1 ? v : net.w <= 4 ? v.toString(2).padStart(net.w, "0") : "0x" + v.toString(16).toUpperCase();
      if (net.w === 1 && v) td.className = "one";
      if (sep) td.classList.add("sep");
    };
    ttIn.forEach((n, i) => cell(nets[n.out[0]], vals[i]));
    ttOut.forEach((n, i) => { const net = nets[n.in[0]]; const td = tr.insertCell(); td.textContent = known(net) ? (net.w === 1 ? net.v : net.w <= 4 ? fmtBits(net) : "0x" + net.v.toString(16).toUpperCase()) : fmtBits(net); if (net.w === 1 && net.v && known(net)) td.className = "one"; if (!i) td.classList.add("sep"); });
    tr.onclick = () => { ttIn.forEach((n, i) => { n.state = vals[i]; }); simulate(); };
    tableRows.push({ tr, vals });
  }
  ttIn.forEach((n, i) => { n.state = saved[i]; });
  settle();
  box.append(t);
}
function markRow() {
  tableRows.forEach(r => r.tr.classList.toggle("cur", r.vals.every((v, i) => v === ttIn[i].state)));
}
function openDrawer(id) {
  ["tabledrawer", "srcdrawer"].forEach(d => $(d).classList.toggle("open", d === id));
  tableOpen = id === "tabledrawer";
  $("tablebtn").setAttribute("aria-pressed", tableOpen);
  $("srcbtn").setAttribute("aria-pressed", id === "srcdrawer");
  requestAnimationFrame(fit);
}
$("tablebtn").onclick = () => { if (tableOpen) return openDrawer(null); buildTable(); openDrawer("tabledrawer"); markRow(); };
$("srcbtn").onclick = () => openDrawer($("srcdrawer").classList.contains("open") ? null : "srcdrawer");
document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => openDrawer(null));

/* ================================================================ source */
let srcFile = -1;
const baseName = f => f.replace(/^.*[\\/]/, "");
function viewFile(id) { return id === 0 ? 0 : D.insts[id].defFile; }
function buildSource(fi) {
  if (fi === srcFile) return;
  srcFile = fi;
  const box = $("src"), f = (D.files || [{ name: D.file, source: D.source }])[fi];
  box.textContent = "";
  f.source.replace(/\n$/, "").split("\n").forEach((line, i) => {
    const row = document.createElement("div"); row.className = "ln"; row.dataset.line = i + 1;
    const no = document.createElement("span"); no.className = "no"; no.textContent = i + 1;
    const tx = document.createElement("span"); tx.className = "tx";
    const c = line.search(/#|\/\//);
    if (c >= 0) { tx.append(line.slice(0, c)); const s = document.createElement("span"); s.className = "cm"; s.textContent = line.slice(c); tx.append(s); }
    else tx.textContent = line || " ";
    row.append(no, tx);
    row.onclick = () => {
      const hit = V.items.filter(n => n.line === i + 1 && (n.file || 0) === srcFile);
      if (hit.length) select(hit.find(n => n.name) || hit[0]);
      markSource(i + 1);
    };
    box.append(row);
  });
  $("srctitle").textContent = baseName(f.name);
}
function markSource(line) {
  document.querySelectorAll("#src .ln").forEach(r => r.classList.toggle("sel", +r.dataset.line === line));
  const r = document.querySelector(`#src .ln[data-line="${line}"]`);
  if (r && $("srcdrawer").classList.contains("open")) r.scrollIntoView({ block: "nearest" });
}

/* ============================================================ navigation */
const instLabel = id => { const i = D.insts[id]; return i.name || i.comp; };
function openView(id) {
  hideTip();
  if (selected) selected = null;
  $("valform").hidden = true;
  V = viewOf(id);
  if (!V.laid) { layout(V); load(V); }
  partsG.textContent = "";
  V.items.forEach(buildPart);
  drawWires();
  redraw();
  /* breadcrumb: circuit, then each chip on the way down */
  const nav = $("crumbs"), chain = [];
  for (let i = id; i > 0; i = D.insts[i].parent) chain.unshift(i);
  nav.hidden = id === 0;
  nav.textContent = "";
  [0, ...chain].forEach((c, k) => {
    const b = document.createElement("button");
    b.textContent = c === 0 ? "Circuit" : instLabel(c);
    if (c !== 0 && D.insts[c].name) { const sm = document.createElement("small"); sm.textContent = D.insts[c].comp; b.append(sm); }
    if (c === id) b.setAttribute("aria-current", "page"); else b.onclick = () => openView(c);
    nav.append(b);
  });
  $("tb-view").textContent = id === 0 ? "the circuit" : `${instLabel(id)}${D.insts[id].name ? " (" + D.insts[id].comp + ")" : ""}, ${baseName((D.files || [])[viewFile(id)] ? D.files[viewFile(id)].name : D.file)}`;
  buildSource(viewFile(id));
  markSource(id === 0 ? 0 : D.insts[id].defLine);
  requestAnimationFrame(fit);
}
function goUp() { if (V && V.id !== 0) openView(D.insts[V.id].parent); }

/* ================================================================ start */
document.title = D.title || D.file;
$("tb-name").textContent = D.title || D.file.replace(/\.wire$/, "");
$("tb-file").textContent = baseName(D.file);
const comps = nodes.filter(n => !SOURCES.has(n.kind) && !SINKS.has(n.kind) && !["split", "merge", "const", "pin_in", "pin_out"].includes(n.kind)).length;
const chips = D.insts ? D.insts.length - 1 : 0;
$("tb-parts").textContent = `${comps} part${comps === 1 ? "" : "s"}${chips ? `, ${chips} chip${chips === 1 ? "" : "s"}` : ""}, ${ttIn.length + clocks.length} in, ${ttOut.length} out`;

WireSim.create(D).then(s => {
  bindSim(s);
  nets.forEach(n => { n.v = 0; n.k = mask(n.w); });
  openView(0);
  simulate();
}).catch(e => {
  const w = $("warn");
  w.style.display = "block";
  w.textContent = "This browser could not run the simulator (WebAssembly): " + e.message;
});
$("fit").onclick = fit;
$("tidy").onclick = () => {
  shared.delete(compOf(V.id));
  try { localStorage.removeItem(keyBase + compOf(V.id)); } catch (e) {}
  layout(V);
  V.items.forEach(place);
  drawWires();
  fit();
};
addEventListener("resize", applyView);
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if (e.key === " " && clocks.length) { e.preventDefault(); stepClock(); }
  if (e.key === "f") fit();
  if (e.key === "Escape") {
    if (document.querySelector(".drawer.open")) openDrawer(null);
    else if (V.id !== 0) goUp();
    else select(null);
  }
  if (e.key === "Backspace") goUp();
});
</script>
</body>
</html>
